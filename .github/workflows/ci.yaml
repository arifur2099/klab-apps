name: Build Scan and Publish
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/klab-apps
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v6
      - name: Set image tag
        id: vars
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          no-cache: true
          load: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
          format: table
          exit-code: '1'
          severity: CRITICAL
      - name: Push image
        run: docker push ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
