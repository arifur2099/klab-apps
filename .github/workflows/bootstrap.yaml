---
name: Bootstrap Container Image

"on":
  workflow_dispatch:
  push:
    branches: [main]

# Authentication to GitHub
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify repository and image destination
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Owner: $GITHUB_REPOSITORY_OWNER"
          echo "Image: ghcr.io/$GITHUB_REPOSITORY_OWNER/klab-apps:v1"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push v1
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: >-
            ghcr.io/${{ github.repository_owner }}/klab-apps:v1
          labels: >-
            org.opencontainers.image.source=https://github.com/${{
            github.repository }}
